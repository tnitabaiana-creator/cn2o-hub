<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protocolo · Cartório de Notas do 2º Ofício de Itabaiana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--vinho:#631325;--marinho:#202a3a;--branco:#ffffff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lato',sans-serif;color:var(--marinho)}
.mont{font-family:'Montserrat',sans-serif}
section{min-height:100vh;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tag{position:absolute;top:16px;left:16px;z-index:9;background:var(--vinho);color:#fff;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;letter-spacing:.18em;padding:6px 12px;border-radius:4px}
input{width:100%;font-family:'Lato',sans-serif;font-size:15px;outline:none}
.btn{width:100%;background:var(--vinho);color:#fff;border:none;border-radius:7px;padding:14px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;margin-top:22px}
.btn:hover{filter:brightness(1.15)}
.restrito{font-family:'Montserrat',sans-serif;font-size:10.5px;letter-spacing:.34em;text-transform:uppercase}
svg.topo{position:absolute;pointer-events:none}

/* ===== Home oficial · Hub de Protocolo CN2O — rubi ao fundo, cartão claro ===== */
.pB{background:var(--vinho)}
.pB::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%, rgba(255,255,255,.10), transparent 58%)}
.pB .topo{left:-30px;top:-20px;height:80%;opacity:.12;stroke:#fff}
.pB .topo2{right:-40px;bottom:-30px;height:70%;opacity:.12;stroke:#fff}
.pB .cartao{width:400px;background:var(--branco);border-radius:14px;border-top:5px solid var(--marinho);padding:44px 40px 38px;box-shadow:0 28px 70px rgba(32,10,16,.45);position:relative}
.pB .marca{display:flex;align-items:center;gap:14px;margin-bottom:30px}
.pB .avatar{height:92px;width:auto;display:block}
.pB .div{width:2.5px;align-self:stretch;background:var(--vinho)}
.pB .tit{color:var(--marinho);font-family:'Montserrat',sans-serif;font-weight:700;font-size:22.5px;letter-spacing:.09em;text-transform:uppercase;line-height:1.1}
.pB .sub{color:var(--vinho);font-family:'Lato',sans-serif;font-weight:400;font-size:13.5px;letter-spacing:.02em;text-transform:none;margin-top:4px;line-height:1.4}
.pB label{display:block;color:var(--vinho);font-family:'Montserrat',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;margin:16px 0 6px}
.pB input{background:var(--branco);border:1.5px solid rgba(32,42,58,.26);border-radius:7px;color:var(--marinho);padding:12px}
.pB input:focus{border-color:var(--marinho)}
.pB .btn{background:var(--marinho)}
.pB .restrito{color:rgba(255,255,255,.55);position:absolute;bottom:-34px;left:0;right:0;text-align:center}
</style>
</head>
<body>

        <div class="tit">Protocolo</div>
        <div class="sub">Cartório de Notas<br>2º Ofício de Itabaiana</div>

    </div>
    <label>Usuário</label>
    <input type="text" placeholder="nome.sobrenome">
    <label>Senha</label>
    <input type="password" placeholder="••••••••">
    <button class="btn">Entrar</button>
    <div class="restrito">Acesso restrito · uso interno da serventia</div>
  </div>
</section>


<script>
/* Vazio = modo demonstração. No go-live: 'https://SEU-SERVICO.up.railway.app' */
const ENDPOINT='';
const el=id=>document.getElementById(id);
const guarda=(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}};
function msg(t){const m=el('msg');m.textContent=t;m.style.display=t?'block':'none';}
let primeiroAcesso=false;

async function entrar(){
  const login=el('login').value.trim().toLowerCase();
  if(!login) return msg('Informe o usuário (nome.sobrenome).');
  if(!ENDPOINT) return msg('Modo demonstração — endpoint ainda não configurado.');
  el('btnEntrar').disabled=true;
  try{
    if(primeiroAcesso){
      const s1=el('senhaNova').value, s2=el('senhaConf').value;
      if(s1.length<8) throw new Error('A senha deve ter no mínimo 8 caracteres.');
      if(s1!==s2) throw new Error('As senhas não conferem.');
      const r=await fetch(ENDPOINT+'/definir-senha',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login,senha:s1})});
      const j=await r.json(); if(!r.ok) throw new Error(j.erro||'Falha ao definir a senha.');
      guarda('cn2o_token',j.token); guarda('cn2o_nome',j.nome); guarda('cn2o_cargo',j.cargo||'');
      location.href='protocolo.html'; return;
    }
    const r=await fetch(ENDPOINT+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login,senha:el('senha').value})});
    const j=await r.json();
    if(r.ok && j.primeiro_acesso){
      primeiroAcesso=true;
      el('blocoSenha').style.display='none'; el('blocoNova').style.display='block';
      el('btnEntrar').textContent='Criar senha e entrar';
      msg('Primeiro acesso: crie a sua senha pessoal. Ela é individual e intransferível.');
      return;
    }
    if(!r.ok) throw new Error(j.erro||'Usuário ou senha inválidos.');
    guarda('cn2o_token',j.token); guarda('cn2o_nome',j.nome); guarda('cn2o_cargo',j.cargo||'');
    location.href='protocolo.html';
  }catch(e){ msg(e.message); }
  finally{ el('btnEntrar').disabled=false; }
}
el('btnEntrar').addEventListener('click',entrar);
document.addEventListener('keydown',e=>{if(e.key==='Enter')entrar();});
</script>
