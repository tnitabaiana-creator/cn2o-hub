# netlify.toml — Hub CN2O (v1.39.2, segurança · pacote B)
#
# 1) Os pacotes de fontes (versoes/*.zip) ficam no repositório, mas NÃO são servidos pelo
#    site: antes, qualquer pessoa baixava o código inteiro do Hub pelo endereço público.
# 2) Cabeçalhos de segurança em todas as páginas. A CSP permite só o que o Hub usa:
#    o servidor da Railway, a planilha das Frases do Dia (docs.google.com), as fontes do
#    Google e o Google Agenda num iframe. Scripts internos ('unsafe-inline') continuam
#    permitidos de propósito: o e-Protocolo e o anexo são editados direto no repositório e
#    uma CSP com hash quebraria a página a cada edição. O que a CSP barra é o que um
#    invasor precisaria para LEVAR dados embora (conexões, imagens e formulários só para os
#    endereços acima) e o Hub dentro de outro site.
#    Ao ligar um serviço novo (outra API, outra imagem externa), acrescente-o aqui.

[[redirects]]
  from = "/versoes/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://cn2o-hub-backend-production.up.railway.app https://docs.google.com https://*.googleusercontent.com; frame-src 'self' blob: https://calendar.google.com; media-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
